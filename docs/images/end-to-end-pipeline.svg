<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title { font: 700 56px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #15385f; }
      .h { font: 700 40px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #1f4f79; }
      .t { font: 500 30px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #315f89; }
      .f { font: 600 28px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #2f5f88; }
    </style>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 z" fill="#3a79ab" />
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#edf4fa" />
  <text x="800" y="90" text-anchor="middle" class="title">数据到知识服务一体化流程</text>

  <rect x="100" y="180" rx="22" ry="22" width="280" height="240" fill="#d8e7f8" stroke="#9cbce0" stroke-width="2" />
  <text x="130" y="250" class="h">1. 数据采集</text>
  <text x="130" y="308" class="t">文献与数据库摘要</text>
  <text x="130" y="356" class="t">外部结构化数据</text>

  <line x1="380" y1="300" x2="460" y2="300" stroke="#3a79ab" stroke-width="6" marker-end="url(#arrow)" />

  <rect x="460" y="180" rx="22" ry="22" width="280" height="240" fill="#e1f2ef" stroke="#a5cfc8" stroke-width="2" />
  <text x="490" y="250" class="h">2. 数据清洗</text>
  <text x="490" y="308" class="t">去噪与标准化</text>
  <text x="490" y="356" class="t">命名归一与映射</text>

  <line x1="740" y1="300" x2="820" y2="300" stroke="#3a79ab" stroke-width="6" marker-end="url(#arrow)" />

  <rect x="820" y="180" rx="22" ry="22" width="280" height="240" fill="#f4ead8" stroke="#d8c09a" stroke-width="2" />
  <text x="850" y="250" class="h">3. 结构化抽取</text>
  <text x="850" y="308" class="t">实体与关系抽取</text>
  <text x="850" y="356" class="t">标准 JSON 入库</text>

  <line x1="1100" y1="300" x2="1180" y2="300" stroke="#3a79ab" stroke-width="6" marker-end="url(#arrow)" />

  <rect x="1180" y="180" rx="22" ry="22" width="280" height="240" fill="#e8e1f7" stroke="#b8a7dd" stroke-width="2" />
  <text x="1210" y="250" class="h">4. 图谱构建</text>
  <text x="1210" y="308" class="t">节点关系写入</text>
  <text x="1210" y="356" class="t">图数据库持久化</text>

  <line x1="1320" y1="420" x2="1320" y2="520" stroke="#3a79ab" stroke-width="6" marker-end="url(#arrow)" />

  <rect x="680" y="520" rx="22" ry="22" width="880" height="170" fill="#f4dfe6" stroke="#d8a7b8" stroke-width="2" />
  <text x="720" y="592" class="h">5. 可视化与问答服务</text>
  <text x="720" y="648" class="t">React 前端 + FastAPI 接口 + RAG 检索增强 + 图谱问答联动</text>

  <text x="100" y="790" class="f">输出成果：可交互图谱平台、分子特征展示、候选推理面板、知识问答服务。</text>
</svg>
