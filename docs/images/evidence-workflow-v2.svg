<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img"><title>知识图谱构建与证据分层流程</title><desc>正式证据与待验证关联分别处理；每条正式关系均保留来源标识与研究语境。</desc><rect width="100%" height="100%" fill="white"/><text x="60" y="59.6" fill="#258c87" font-size="20" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-weight="400">TAUCLEAR  /  KG v2.0</text><text x="60" y="121.2" fill="#263b45" font-size="40" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-weight="400">知识图谱构建与证据分层流程</text><text x="60" y="163.36" fill="#6c7e89" font-size="22" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-weight="400">正式证据与待验证关联分别处理；每条正式关系均保留来源标识与研究语境。</text><polyline points="60,188 1540,188" fill="none" stroke="#dce5e9" stroke-width="2"/><rect x="60" y="230" width="310" height="165" rx="12" fill="#f7fafb" stroke="#dce5e9" stroke-width="2"/><polyline points="80,253 80,278" fill="none" stroke="#258c87" stroke-width="4"/><text x="95" y="274.76" fill="#258c87" font-size="27" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-weight="600">01  身份与来源</text><text x="84" y="317.48" fill="#6c7e89" font-size="21" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-weight="400">核对 3 个 PubChem CID</text><text x="84" y="348.48" fill="#6c7e89" font-size="21" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-weight="400">汇集 10 篇原始研究</text><polyline points="375,312 442,312" fill="none" stroke="#258c87" stroke-width="2"/><polygon points="442,312 431.4690092573155,317.75310646325045 431.4690092573155,306.24689353674955" fill="#258c87"/><rect x="450" y="230" width="310" height="165" rx="12" fill="#f7fafb" stroke="#dce5e9" stroke-width="2"/><polyline points="470,253 470,278" fill="none" stroke="#258c87" stroke-width="4"/><text x="485" y="274.76" fill="#258c87" font-size="27" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-weight="600">02  实体标准化</text><text x="474" y="317.48" fill="#6c7e89" font-size="21"