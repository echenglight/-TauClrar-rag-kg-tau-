<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <defs>
    <style>
      .title { font: 700 56px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #143a63; }
      .sub { font: 500 30px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #3c6f9d; }
      .h { font: 700 62px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #204a73; }
      .t { font: 600 48px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #315f88; }
      .foot { font: 600 36px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #3d6a94; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#4e86b5" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="980" fill="#eef4fb" />
  <text x="700" y="98" text-anchor="middle" class="title">TauClear 平台分层架构</text>
  <text x="700" y="146" text-anchor="middle" class="sub">前端交互层 → 服务接口层 → 领域服务层 → 数据与知识层</text>

  <rect x="95" y="190" rx="26" ry="26" width="1210" height="180" fill="#d8e6f8" stroke="#9cbadd" stroke-width="2" />
  <text x="145" y="270" class="h">L1 交互呈现层</text>
  <text x="145" y="330" class="t">frontend/src/App.tsx · GraphCanvas.tsx · 智能问答面板 · 过滤与布局控制</text>

  <line x1="700" y1="370" x2="700" y2="430" stroke="#4e86b5" stroke-width="5" marker-end="url(#arrow)" />

  <rect x="95" y="410" rx="26" ry="26" width="1210" height="180" fill="#dff0f7" stroke="#99c6d8" stroke-width="2" />
  <text x="145" y="490" class="h">L2 接口编排层</text>
  <text x="145" y="550" class="t">FastAPI 路由：routes_graph.py / routes_analysis.py / routes_chat.py · 统一返回结构</text>

  <line x1="700" y1="590" x2="700" y2="650" stroke="#4e86b5" stroke-width="5" marker-end="url(#arrow)" />

  <rect x="95" y="630" rx="26" ry="26" width="1210" height="180" fill="#e3f5ee" stroke="#9acdb7" stroke-width="2" />
  <text x="145" y="710" class="h">L3 领域服务层</text>
  <text x="145" y="770" class="t">图谱检索聚合 · 分子特征服务 · LightGNN 候选评分 · 邻居扩展分析</text>

  <line x1="700" y1="810" x2="700" y2="870" stroke="#4e86b5" stroke-width="5" marker-end="url(#arrow)" />

  <rect x="95" y="850" rx="26" ry="26" width="1210" height="110" fill="#ebf8f3" stroke="#a5d4c2" stroke-width="2" />
  <text x="145" y="923" class="t">L4 数据与知识层：backend/data/mock_data.json · Neo4j 图数据库 · data/molecule/*.csv</text>

  <text x="700" y="970" text-anchor="middle" class="foot">分层原则：前端不直连底层存储，统一经 API 与服务层解耦，便于持续扩展</text>
</svg>
