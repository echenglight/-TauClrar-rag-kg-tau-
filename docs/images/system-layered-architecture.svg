<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <defs>
    <style>
      .title { font: 700 56px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #143a63; }
      .sub { font: 500 26px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #3c6f9d; }
      .h { font: 700 34px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #204a73; }
      .t { font: 600 22px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #315f88; }
      .foot { font: 600 20px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #3d6a94; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#4e86b5" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1080" fill="#eef4fb" />
  <text x="800" y="96" text-anchor="middle" class="title">TauClear 平台分层架构</text>
  <text x="800" y="142" text-anchor="middle" class="sub">前端交互层 → 服务接口层 → 领域服务层 → 数据与知识层</text>

  <rect x="120" y="180" rx="26" ry="26" width="1360" height="160" fill="#d8e6f8" stroke="#9cbadd" stroke-width="2" />
  <text x="175" y="245" class="h">L1 交互呈现层</text>
  <text x="175" y="285" class="t">frontend/src/App.tsx · GraphCanvas.tsx · 智能问答面板 · 过滤与布局控制</text>

  <line x1="800" y1="340" x2="800" y2="390" stroke="#4e86b5" stroke-width="5" marker-end="url(#arrow)" />

  <rect x="120" y="390" rx="26" ry="26" width="1360" height="160" fill="#dff0f7" stroke="#99c6d8" stroke-width="2" />
  <text x="175" y="455" class="h">L2 接口编排层</text>
  <text x="175" y="495" class="t">FastAPI 路由：routes_graph.py / routes_analysis.py / routes_chat.py · 统一返回结构</text>

  <line x1="800" y1="550" x2="800" y2="600" stroke="#4e86b5" stroke-width="5" marker-end="url(#arrow)" />

  <rect x="120" y="600" rx="26" ry="26" width="1360" height="160" fill="#e3f5ee" stroke="#9acdb7" stroke-width="2" />
  <text x="175" y="665" class="h">L3 领域服务层</text>
  <text x="175" y="705" class="t">图谱检索聚合 · 分子特征服务 · LightGNN 候选评分 · 邻居扩展分析</text>

  <line x1="800" y1="760" x2="800" y2="810" stroke="#4e86b5" stroke-width="5" marker-end="url(#arrow)" />

  <rect x="120" y="810" rx="26" ry="26" width="1360" height="120" fill="#ebf8f3" stroke="#a5d4c2" stroke-width="2" />
  <text x="175" y="880" class="t">L4 数据与知识层：backend/data/mock_data.json · Neo4j 图数据库 · data/molecule/*.csv</text>

  <text x="800" y="1018" text-anchor="middle" class="foot">分层原则：前端不直连底层存储，统一经 API 与服务层解耦，便于持续扩展</text>
</svg>
