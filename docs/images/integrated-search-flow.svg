<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="900" viewBox="0 0 1700 900">
  <defs>
    <style>
      .title { font: 700 54px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #123861; }
      .h { font: 700 42px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #1f4d78; }
      .t { font: 500 30px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #2d5e88; }
      .f { font: 600 28px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #365f84; }
      .line { stroke: #3d79aa; stroke-width: 5; fill: none; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#3d79aa" />
    </marker>
  </defs>

  <rect width="1700" height="900" fill="#eef4fb" />
  <text x="850" y="92" text-anchor="middle" class="title">统一检索联动流程（KG + 分子特征 + 候选推理）</text>

  <rect x="90" y="230" rx="18" ry="18" width="270" height="140" fill="#d8e6f8" stroke="#96b5da" stroke-width="2" />
  <text x="125" y="292" class="h">输入关键词</text>
  <text x="125" y="340" class="t">基因 / 化合物 / 疾病</text>

  <rect x="470" y="230" rx="18" ry="18" width="320" height="140" fill="#e2f2ef" stroke="#9ecfc6" stroke-width="2" />
  <text x="505" y="292" class="h">接口编排层</text>
  <text x="505" y="340" class="t">/api/analysis/search</text>

  <rect x="900" y="150" rx="18" ry="18" width="360" height="120" fill="#f4ead8" stroke="#d5bf9a" stroke-width="2" />
  <text x="935" y="206" class="h">图谱检索服务</text>
  <text x="935" y="248" class="t">节点与关系子图返回</text>

  <rect x="900" y="290" rx="18" ry="18" width="360" height="120" fill="#e8e1f7" stroke="#b8aadf" stroke-width="2" />
  <text x="935" y="346" class="h">分子特征服务</text>
  <text x="935" y="388" class="t">指纹位点与描述符聚合</text>

  <rect x="900" y="430" rx="18" ry="18" width="360" height="120" fill="#f4dfe6" stroke="#d9afbf" stroke-width="2" />
  <text x="935" y="486" class="h">候选推理服务</text>
  <text x="935" y="528" class="t">LightGNN 多跳评分</text>

  <rect x="1330" y="230" rx="18" ry="18" width="280" height="140" fill="#d9e8f8" stroke="#9bb8db" stroke-width="2" />
  <text x="1365" y="292" class="h">统一响应结果</text>
  <text x="1365" y="340" class="t">KG + 分子 + GNN</text>

  <rect x="1110" y="560" rx="18" ry="18" width="560" height="180" fill="#e8f3ff" stroke="#a8c6e3" stroke-width="2" />
  <text x="1145" y="628" class="h">前端联动展示</text>
  <text x="1145" y="678" class="t">交互图谱 · 分子卡片 · 候选列表 · 问答面板</text>

  <line x1="360" y1="300" x2="470" y2="300" class="line" marker-end="url(#arrow)" />

  <polyline points="790,300 900,210" class="line" marker-end="url(#arrow)" />
  <line x1="790" y1="300" x2="900" y2="350" class="line" marker-end="url(#arrow)" />
  <polyline points="790,300 900,490" class="line" marker-end="url(#arrow)" />

  <line x1="1260" y1="210" x2="1330" y2="270" class="line" marker-end="url(#arrow)" />
  <line x1="1260" y1="350" x2="1330" y2="300" class="line" marker-end="url(#arrow)" />
  <line x1="1260" y1="490" x2="1330" y2="330" class="line" marker-end="url(#arrow)" />

  <line x1="1470" y1="370" x2="1470" y2="560" class="line" marker-end="url(#arrow)" />

  <text x="90" y="820" class="f">说明：统一检索接口将三类结果同时返回，保证同一关键词下的数据一致性与可解释性。</text>
</svg>
