<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="760" viewBox="0 0 1700 760">
  <defs>
    <style>
      .title { font: 700 54px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #123861; }
      .h { font: 700 40px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #1f4d78; }
      .t { font: 500 33px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #2d5e88; }
      .f { font: 600 31px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #365f84; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#3d79aa" />
    </marker>
  </defs>

  <rect width="1700" height="760" fill="#eef4fb" />
  <text x="850" y="88" text-anchor="middle" class="title">统一检索联动流程（KG + 分子特征 + 候选推理）</text>

  <rect x="80" y="220" rx="20" ry="20" width="250" height="150" fill="#d8e6f8" stroke="#96b5da" stroke-width="2" />
  <text x="115" y="290" class="h">输入关键词</text>
  <text x="115" y="340" class="t">基因/化合物/疾病</text>

  <line x1="330" y1="295" x2="430" y2="295" stroke="#3d79aa" stroke-width="6" marker-end="url(#arrow)" />

  <rect x="430" y="220" rx="20" ry="20" width="280" height="150" fill="#e2f2ef" stroke="#9ecfc6" stroke-width="2" />
  <text x="470" y="290" class="h">接口编排层</text>
  <text x="470" y="340" class="t">/api/analysis/search</text>

  <line x1="570" y1="370" x2="570" y2="480" stroke="#3d79aa" stroke-width="6" marker-end="url(#arrow)" />

  <line x1="710" y1="295" x2="840" y2="215" stroke="#3d79aa" stroke-width="6" marker-end="url(#arrow)" />
  <line x1="710" y1="295" x2="840" y2="295" stroke="#3d79aa" stroke-width="6" marker-end="url(#arrow)" />
  <line x1="710" y1="295" x2="840" y2="375" stroke="#3d79aa" stroke-width="6" marker-end="url(#arrow)" />

  <rect x="840" y="140" rx="20" ry="20" width="330" height="130" fill="#f4ead8" stroke="#d5bf9a" stroke-width="2" />
  <text x="880" y="205" class="h">图谱检索服务</text>
  <text x="880" y="252" class="t">节点与关系子图返回</text>

  <rect x="840" y="270" rx="20" ry="20" width="330" height="130" fill="#e8e1f7" stroke="#b8aadf" stroke-width="2" />
  <text x="880" y="335" class="h">分子特征服务</text>
  <text x="880" y="382" class="t">指纹位点与描述符聚合</text>

  <rect x="840" y="400" rx="20" ry="20" width="330" height="130" fill="#f4dfe6" stroke="#d9afbf" stroke-width="2" />
  <text x="880" y="465" class="h">候选推理服务</text>
  <text x="880" y="512" class="t">LightGNN 多跳评分</text>

  <line x1="1170" y1="205" x2="1290" y2="295" stroke="#3d79aa" stroke-width="6" marker-end="url(#arrow)" />
  <line x1="1170" y1="335" x2="1290" y2="295" stroke="#3d79aa" stroke-width="6" marker-end="url(#arrow)" />
  <line x1="1170" y1="465" x2="1290" y2="295" stroke="#3d79aa" stroke-width="6" marker-end="url(#arrow)" />

  <rect x="1290" y="220" rx="20" ry="20" width="320" height="150" fill="#d9e8f8" stroke="#9bb8db" stroke-width="2" />
  <text x="1330" y="290" class="h">统一响应结果</text>
  <text x="1330" y="340" class="t">KG + 分子 + GNN</text>

  <line x1="1450" y1="370" x2="1450" y2="490" stroke="#3d79aa" stroke-width="6" marker-end="url(#arrow)" />

  <rect x="1140" y="490" rx="20" ry="20" width="620" height="190" fill="#e8f3ff" stroke="#a8c6e3" stroke-width="2" />
  <text x="1180" y="560" class="h">前端联动展示</text>
  <text x="1180" y="615" class="t">交互图谱 · 分子卡片 · 候选列表 · 问答面板</text>

  <text x="80" y="640" class="f">说明：统一检索接口将三类结果同时返回，保证同一关键词下的数据一致性与可解释性。</text>
</svg>
