<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="900" viewBox="0 0 1700 900">
  <defs>
    <style>
      .title { font: 700 54px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #123861; }
      .h { font: 700 42px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #1f4d78; }
      .t { font: 500 30px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #2d5e88; }
      .f { font: 600 28px 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #365f84; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#3d79aa" />
    </marker>
  </defs>

  <rect width="1700" height="900" fill="#eef4fb" />
  <text x="850" y="92" text-anchor="middle" class="title">统一检索联动流程（KG + 分子特征 + 候选推理）</text>

  <rect x="90" y="220" rx="18" ry="18" width="260" height="140" fill="#d8e6f8" stroke="#96b5da" stroke-width="2" />
  <text x="120" y="282" class="h">输入关键词</text>
  <text x="120" y="330" class="t">基因 / 化合物 / 疾病</text>

  <line x1="350" y1="290" x2="440" y2="290" stroke="#3d79aa" stroke-width="6" marker-end="url(#arrow)" />

  <rect x="440" y="220" rx="18" ry="18" width="300" height="140" fill="#e2f2ef" stroke="#9ecfc6" stroke-width="2" />
  <text x="475" y="282" class="h">接口编排层</text>
  <text x="475" y="330" class="t">/api/analysis/search</text>

  <line x1="740" y1="290" x2="840" y2="210" stroke="#3d79aa" stroke-width="6" marker-end="url(#arrow)" />
  <line x1="740" y1="290" x2="840" y2="290" stroke="#3d79aa" stroke-width="6" marker-end="url(#arrow)" />
  <line x1="740" y1="290" x2="840" y2="370" stroke="#3d79aa" stroke-width="6" marker-end="url(#arrow)" />

  <rect x="840" y="140" rx="18" ry="18" width="360" height="120" fill="#f4ead8" stroke="#d5bf9a" stroke-width="2" />
  <text x="875" y="196" class="h">图谱检索服务</text>
  <text x="875" y="238" class="t">节点与关系子图返回</text>

  <rect x="840" y="270" rx="18" ry="18" width="360" height="120" fill="#e8e1f7" stroke="#b8aadf" stroke-width="2" />
  <text x="875" y="326" class="h">分子特征服务</text>
  <text x="875" y="368" class="t">指纹位点与描述符聚合</text>

  <rect x="840" y="400" rx="18" ry="18" width="360" height="120" fill="#f4dfe6" stroke="#d9afbf" stroke-width="2" />
  <text x="875" y="456" class="h">候选推理服务</text>
  <text x="875" y="498" class="t">LightGNN 多跳评分</text>

  <line x1="1200" y1="200" x2="1310" y2="290" stroke="#3d79aa" stroke-width="6" marker-end="url(#arrow)" />
  <line x1="1200" y1="330" x2="1310" y2="290" stroke="#3d79aa" stroke-width="6" marker-end="url(#arrow)" />
  <line x1="1200" y1="460" x2="1310" y2="290" stroke="#3d79aa" stroke-width="6" marker-end="url(#arrow)" />

  <rect x="1310" y="220" rx="18" ry="18" width="300" height="140" fill="#d9e8f8" stroke="#9bb8db" stroke-width="2" />
  <text x="1345" y="282" class="h">统一响应结果</text>
  <text x="1345" y="330" class="t">KG + 分子 + GNN</text>

  <line x1="1460" y1="360" x2="1460" y2="480" stroke="#3d79aa" stroke-width="6" marker-end="url(#arrow)" />

  <rect x="1080" y="480" rx="18" ry="18" width="610" height="180" fill="#e8f3ff" stroke="#a8c6e3" stroke-width="2" />
  <text x="1115" y="548" class="h">前端联动展示</text>
  <text x="1115" y="598" class="t">交互图谱 · 分子卡片 · 候选列表 · 问答面板</text>

  <text x="90" y="760" class="f">说明：统一检索接口将三类结果同时返回，保证同一关键词下的数据一致性与可解释性。</text>
</svg>
