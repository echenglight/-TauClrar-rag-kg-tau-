<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img"><title>有向证据排序与计算核验</title><desc>评分表示路径在当前规则下的相对排序；不是概率、药效或生物学预测准确率。</desc><rect width="100%" height="100%" fill="white"/><text x="60" y="59.6" fill="#258c87" font-size="20" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-weight="400">TAUCLEAR  /  KG v2.0</text><text x="60" y="121.2" fill="#263b45" font-size="40" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-weight="400">有向证据排序与计算核验</text><text x="60" y="163.36" fill="#6c7e89" font-size="22" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-weight="400">评分表示路径在当前规则下的相对排序；不是概率、药效或生物学预测准确率。</text><polyline points="60,188 1540,188" fill="none" stroke="#dce5e9" stroke-width="2"/><rect x="60" y="225" width="850" height="445" rx="12" fill="#f7fafb" stroke="#dce5e9" stroke-width="2"/><text x="90" y="279.64" fill="#258c87" font-size="28" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-weight="600">候选得分：取所有有效路径的最大值</text><text x="90" y="333.76" fill="#263b45" font-size="27" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-weight="400">score = max [ (w1 × … × wh) × 0.82^(h − 1) ]</text><text x="90" y="383.24" fill="#6c7e89" font-size="23" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-weight="400">h ≤ 4；沿箭头方向；路径中不重复节点</text><rect x="100" y="445" width="200" height="70" rx="12" fill="white" stroke="#d99536" stroke-width="2"/><text x="126" y="488.0" fill="#d99536" font-size="25" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-weight="400">阿司匹林</text><rect x="380" y="445" width="200" height="70" rx="12" fill="white" stroke="#8a2856" stroke-width="2"/><text x="406" y="488.0" fill="#8a2856" font-size="25" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-weight="400">TFEB</text><rect x="660" y="445" width="200" height="70" rx="12" fill="white" stroke="#258c87" stroke-width="2"/><text x="686" y="488.0" fill="#258c87"